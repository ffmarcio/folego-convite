<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Convite · Folegando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fff; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: min(420px, 100% - 32px); }
  h1 { display: flex; align-items: center; gap: 8px; font: 900 40px/1 "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; margin: 0 0 12px; letter-spacing: .01em; }
  h1 svg { width: 44px; height: 44px; flex: none; }
  .ponto { color: #FF5A36; }
  .codigo { font-size: 40px; font-weight: 800; letter-spacing: .25em; margin: 16px 0; }
  a.botao { display: block; text-align: center; background: #FF5A36; color: #000; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; text-decoration: none; border-radius: 14px; padding: 16px; margin: 18px 0 12px; }
  p { color: #E8E9EB; margin: 8px 0; }
  .mini { color: #C9CCD1; font-size: 14px; }
</style>
</head>
<body>
<main>
  <!-- Lockup (D64, D74): anel + "folegando." em Barlow Condensed 900 -->
  <h1><svg viewBox="18 18 72 72" aria-hidden="true"><g transform="translate(54 54) scale(1.05) translate(-54 -54)"><path d="M75.92 55.92 A22 22 0 1 1 52.08 32.08" fill="none" stroke="#9FE7DC" stroke-width="10" stroke-linecap="round"/><circle cx="69.56" cy="38.44" r="7" fill="#FF5A36"/></g></svg><span>folegando<span class="ponto">.</span></span></h1>
  <p>Você foi convidado para treinar junto com uma comunidade no Folegando.</p>
  <div class="codigo" id="codigo">——</div>
  <a class="botao" id="abrir" href="#">Abrir no Folegando</a>
  <p class="mini">Se nada acontecer, o app ainda não está no seu celular: peça o link de instalação a quem te convidou. Depois, abra este convite de novo ou digite o código em Você › Comunidades.</p>
</main>
<script>
  // Página estática sem dados: só lê o código da URL (?c=ABC234) e abre o app (folego://convite/ABC234).
  var c = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  document.getElementById('codigo').textContent = c || '——';
  var link = 'folego://convite/' + c;
  document.getElementById('abrir').href = link;
  if (c.length === 6) setTimeout(function () { location.href = link; }, 300);
</script>
</body>
</html>
